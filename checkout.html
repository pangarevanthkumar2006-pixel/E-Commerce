<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | ShopEasy</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="css/checkout.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">

        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">

                🛒 ShopEasy

            </a>

            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a class="nav-link" href="index.html">Home</a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link" href="products.html">Products</a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link" href="cart.html">

                            <i class="fa-solid fa-cart-shopping"></i>

                            Cart

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>



    <!-- Checkout Section -->

    <section class="checkout-section">

        <div class="container">

            <h1 class="checkout-title">

                Secure Checkout

            </h1>

            <div class="row g-4">
                <!--left side -->
                <div class="col-lg-8 col-md-12">
                    <!-- Customer Details -->



                    <div class=" checkout-card">

                        <h3>

                            <i class="fa-solid fa-user"></i>

                            Customer Information

                        </h3>

                        <form id="checkoutForm">

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label>Full Name</label>

                                    <input type="text" class="form-control" id="name" placeholder="Enter your full name"
                                        required>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label>Email</label>

                                    <input type="email" class="form-control" id="email" placeholder="Enter your email"
                                        required>

                                </div>

                            </div>

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label>Phone Number</label>

                                    <input type="tel" class="form-control" id="phone"
                                        placeholder="10-digit mobile number" required>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label>City</label>

                                    <input type="text" class="form-control" id="city" placeholder="Enter your city"
                                        required>

                                </div>

                            </div>

                            <div class="mb-3">

                                <label>Shipping Address</label>

                                <textarea class="form-control" id="address" rows="4"
                                    placeholder="Enter your complete address" required></textarea>

                            </div>

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label>State</label>

                                    <input type="text" class="form-control" id="state" placeholder="Enter state"
                                        required>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label>Pincode</label>

                                    <input type="text" class="form-control" id="pincode" placeholder="Enter pincode"
                                        required>

                                </div>

                            </div>

                        </form>

                    </div>

                    <!-- Payment -->
                    <div class="checkout-card mt-4">

                        <h3>
                            <i class="fa-solid fa-credit-card"></i>
                            Payment Method
                        </h3>

                        <!-- Cash on Delivery -->
                        <div class="payment-option">
                            <input type="radio" name="payment" value="cod" checked>
                            Cash on Delivery
                        </div>

                        <!-- UPI -->
                        <div class="payment-option">
                            <input type="radio" name="payment" value="upi">
                            UPI Payment
                        </div>

                        <!-- Card -->
                        <div class="payment-option">
                            <input type="radio" name="payment" value="card">
                            Credit / Debit Card
                        </div>
                        <div>
                            <!--Right Side-->
                            <div class="" col-lg-3 ms-auto">
                                <div class="summary-card">
                                    <!--Order Summary---->
                                </div>
                            </div>
                        </div>
                        <!-- ==================== -->
                        <!-- UPI DETAILS -->
                        <!-- ==================== -->

                        <div id="upiSection" style="display:none; margin-top:20px;">

                            <label class="mb-2 fw-bold">
                                Choose UPI App
                            </label>

                            <select id="upiApp" class="form-control">

                                <option value="">
                                    Select UPI App
                                </option>

                                <option>Google Pay</option>

                                <option>PhonePe</option>

                                <option>Paytm</option>

                                <option>BHIM</option>

                            </select>

                            <input type="text" id="upiId" class="form-control mt-3"
                                placeholder="Enter UPI ID (example@okaxis)">

                        </div>

                        <!-- ==================== -->
                        <!-- CARD DETAILS -->
                        <!-- ==================== -->

                        <div id="cardSection" style="display:none; margin-top:20px;">

                            <input type="text" id="cardName" class="form-control mb-3" placeholder="Card Holder Name">

                            <input type="text" id="cardNumber" maxlength="16" class="form-control mb-3"
                                placeholder="Card Number">

                            <div class="row">

                                <div class="col-md-6">

                                    <input type="text" id="expiry" class="form-control" placeholder="MM/YY">

                                </div>

                                <div class="col-md-6">

                                    <input type="password" maxlength="3" id="cvv" class="form-control"
                                        placeholder="CVV">

                                </div>

                            </div>

                        </div>

                    </div>






                    <!-- Order Summary -->

                    <div class="col-lg-4">

                        <div class="summary-card">

                            <h3>

                                Order Summary

                            </h3>

                            <hr>

                            <div id="orderItems">

                                <!-- JavaScript will display products -->

                            </div>

                            <hr>

                            <div class="summary-row">

                                <span>Subtotal</span>

                                <span id="subtotal">

                                    ₹0

                                </span>

                            </div>

                            <div class="summary-row">

                                <span>Shipping</span>

                                <span>

                                    FREE

                                </span>

                            </div>

                            <div class="summary-row">

                                <span>GST</span>

                                <span id="gst">

                                    ₹0

                                </span>

                            </div>

                            <hr>

                            <div class="summary-row total">

                                <span>Total</span>

                                <span id="grandTotal">

                                    ₹0

                                </span>

                            </div>

                            <button id="placeOrderBtn" class="btn btn-success w-100 mt-4">

                                <i class="fa-solid fa-lock"></i>

                                Place Order

                            </button>

                        </div>

                    </div>



                </div>

    </section>



    <script src="js/checkout.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Loading Spinner -->
    <div id="loadingOverlay" class="loading-overlay">

        <div class="loading-box">

            <div class="spinner-border text-success" style="width:70px;height:70px;" role="status">
            </div>

            <h3 class="mt-4">
                Processing Your Order...
            </h3>

            <p>Please wait</p>

        </div>

    </div>
</body>

</html>
